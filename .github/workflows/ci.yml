name: Shell validation

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check build script syntax
        run: bash -n build.sh
      - name: Check Android script syntax
        run: |
          sh -n android/install.sh
          sh -n android/start.sh
          sh -n android/stop.sh
